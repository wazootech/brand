title: Wazoo Brand Guide
description: Official Wazoo visual identity, color, type, and motion guidelines
baseurl: ""
url: https://wazootech.github.io
repository: wazootech/brand
permalink: /:title/

collections:
  brand:
    output: true
    permalink: /:path/

# Colors from brand palette
brand:
  primary: "#FF9800"
  primary-light: "#FFB74D"
  primary-dark: "#F57C00"
  void: "#040404"
  surface: "#0F0F0F"
  light-bg: "#FAFAF9"
  text: "#B0B0B1"
  text-muted: "#7C7C7C"
  white: "#FFFFFF"
  text-dark: "#18181B"
  highlight: "#FFAA00"

# Build settings
markdown: kramdown
sass:
  style: compressed
  sass_dir: _sass

# GitHub Pages metadata
theme: minima
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - github-pages

defaults:
  - scope:
      path: ""
    values:
      layout: default
